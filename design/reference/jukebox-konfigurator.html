<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVANDA Jukebox Barvy</title>
<script>if (/[?&]display=/.test(location.search)) document.documentElement.classList.add('disp');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;700;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#050507;
  --panel:#101114;
  --panel-2:#16181c;
  --line:#2a2c33;
  --line-2:#3a3d45;
  --text:#f2f2f4;
  --muted:#9a9ca5;
  --lime:#b6ff4d;
  --cyan:#3ee6ff;
  --orange:#ff9a3c;
  --pink:#ff4fd8;
  --violet:#7a5cff;
  --mint:#5ff5e0;
  --pixel:'Silkscreen', 'Courier New', monospace;
  --body:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:transparent;color:var(--text);height:100%;overflow:hidden}
html{zoom:1.3}
body{font-family:var(--body);font-size:15px;line-height:1.5;margin:0;padding-inline:0 6px;padding-block:0 12px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

/* ---------- header ---------- */
.top{max-width:none;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-block:4px 16px;border-bottom:3px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{flex-shrink:0}
.brand h1{margin:0;font-family:var(--pixel);font-weight:700;font-size:20px;letter-spacing:3px;line-height:1.2;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top .spacer{flex:1 1 auto}

/* ---------- segmented controls ---------- */
.seg{display:inline-flex;border:3px solid var(--line);background:var(--panel);box-shadow:4px 4px 0 #000}
.seg button{border:0;background:transparent;color:var(--muted);font-family:var(--pixel);font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:9px 14px;cursor:pointer;min-height:40px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--ink);box-shadow:inset 2px 2px 0 #e4ffb3,inset -3px -3px 0 #72a82a}
.seg-label{font-family:var(--pixel);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block}
.seg-wrap{display:flex;flex-direction:column}

/* ---------- layout ---------- */
.layout{max-width:none;margin:18px 0 0;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* ---------- control panel ---------- */
.controls{background:var(--panel);border:3px solid var(--line);box-shadow:6px 6px 0 #000;display:flex;flex-direction:column}
.editing{padding:14px 16px;border-bottom:3px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.editing strong{font-family:var(--pixel);font-weight:400;letter-spacing:1px;color:var(--text);text-transform:uppercase;font-size:12px}
.editing .dot{width:12px;height:12px;flex-shrink:0;background:var(--lime)}
details{border-bottom:3px solid var(--line)}
details:last-of-type{border-bottom:0}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-family:var(--pixel);font-size:13px;letter-spacing:2px;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:16px;color:var(--muted)}
details[open] summary::after{content:"–"}
summary:hover{background:var(--panel-2)}
.group{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.row label{font-size:14px}
.row small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.color{display:flex;align-items:center;gap:8px}
.color input[type=color]{width:40px;height:34px;padding:0;border:3px solid var(--line-2);background:var(--ink);cursor:pointer}
.color input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color input[type=color]::-webkit-color-swatch{border:0}
.color input[type=text]{width:88px;height:34px;padding:0 8px;background:var(--ink);border:3px solid var(--line-2);font-family:'JetBrains Mono',monospace;font-size:13px;text-transform:uppercase}
.color input[type=text]:focus{border-color:var(--lime);outline:none}
.range{display:flex;align-items:center;gap:10px}
.range input{width:130px;accent-color:var(--lime)}
.range output{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.switch{position:relative;width:52px;height:28px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;background:var(--ink);border:3px solid var(--line-2);pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--muted);transition:transform .15s steps(2,end)}
.switch input:checked + span{border-color:var(--lime)}
.switch input:checked + span::after{transform:translateX(24px);background:var(--lime)}
.switch input:focus-visible + span{outline:3px solid var(--lime);outline-offset:2px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border:3px solid var(--line-2);cursor:pointer;padding:0}
.swatches button:hover{border-color:var(--text)}

.actions{padding:16px;border-top:3px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{cursor:pointer;min-height:44px;padding:8px 12px;border:3px solid #9fa1a8;background:var(--panel-2);font-family:var(--pixel);font-size:11px;letter-spacing:1px;text-transform:uppercase;box-shadow:4px 4px 0 #000}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--ink);box-shadow:4px 4px 0 #000,inset 2px 2px 0 #e4ffb3,inset -3px -3px 0 #72a82a}
.btn.full{grid-column:1 / -1}
.btn.attached{background:var(--panel-2);border-color:var(--lime);color:var(--lime);box-shadow:4px 4px 0 #000}
.toast{grid-column:1 / -1;min-height:20px;font-size:13px;color:var(--lime)}
.io{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px}
.io textarea{width:100%;min-height:150px;padding:10px;background:var(--ink);border:3px solid var(--line-2);font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;resize:vertical}

/* ---------- preview ---------- */
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.stage-bar p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
.stage-opts{display:flex;align-items:center;gap:10px;font-size:13px}
.phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:640px){.phones{grid-template-columns:minmax(0,1fr)}}
.phone-card{display:flex;flex-direction:column;gap:10px;min-width:0}
.phone-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phone-head span{font-family:var(--pixel);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.phone-head em{font-style:normal;font-size:12px;color:var(--muted)}
.phone-frame{cursor:pointer;padding:10px;background:#0c0d10;border:3px solid var(--line);box-shadow:6px 6px 0 #000;max-width:100%}
.phone-card.is-editing .phone-frame{border-color:var(--lime)}
.phone-card.is-editing .phone-head span{color:var(--lime)}

.screen{position:relative;width:100%;aspect-ratio:540/960;overflow:hidden;background:var(--base);isolation:isolate;max-width:100%}
.screen canvas.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.screen .fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.screen .ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column}

/* ===== PIXEL design (scaled with --u) ===== */
.px-ui{gap:calc(12*var(--u));padding:calc(12*var(--u)) calc(12*var(--u)) calc(14*var(--u)) calc(10*var(--u));font-family:var(--body);color:var(--txt)}
.px-canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.px-fx{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 4px),repeating-conic-gradient(rgba(0,0,0,.16) 0 25%,transparent 0 50%);background-size:auto,4px 4px}
.px-head{position:relative;height:calc(52*var(--u));display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.px-logo{width:calc(38*var(--u));height:calc(48*var(--u));margin-left:calc(4*var(--u));color:var(--acc)}
.px-credit{position:absolute;left:50%;top:0;transform:translateX(-50%);width:calc(210*var(--u));height:calc(52*var(--u));display:flex;align-items:center;justify-content:center;gap:calc(12*var(--u));background:#050507;border:calc(3*var(--u)) solid var(--acc);box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 #000,inset 0 0 0 calc(3*var(--u)) #050507,inset 0 0 0 calc(5*var(--u)) var(--acc-tint)}
.px-digits{display:flex;gap:calc(7.2*var(--u))}
.px-digit{display:grid;grid-template-columns:repeat(4,calc(5.4*var(--u)));grid-template-rows:repeat(5,calc(5.4*var(--u)));gap:calc(1.8*var(--u))}
.px-digit i.on{background:var(--acc)}
.px-kc{font-family:var(--pixel);font-size:calc(15*var(--u));color:var(--txt)}
.px-ibtn{width:calc(52*var(--u));height:calc(52*var(--u));flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#1a1c20;border:calc(3*var(--u)) solid #9fa1a8;box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 #000,inset calc(3*var(--u)) calc(3*var(--u)) 0 rgba(255,255,255,.08),inset calc(-3*var(--u)) calc(-3*var(--u)) 0 rgba(0,0,0,.45);color:#fff}
.px-ibtn svg{width:calc(28*var(--u));height:calc(24*var(--u))}
.px-toggle{height:calc(52*var(--u));flex-shrink:0;display:flex;border:calc(3*var(--u)) solid #24262b;background:#111315;box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 #000}
.px-toggle div{flex:1 1 0;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-weight:700;font-size:calc(14*var(--u));letter-spacing:calc(7*var(--u));padding-left:calc(7*var(--u));color:#8d9098}
.px-toggle div.on{background:var(--acc);color:var(--acc-ink);box-shadow:inset calc(3*var(--u)) calc(3*var(--u)) 0 var(--acc-hi),inset calc(-4*var(--u)) calc(-4*var(--u)) 0 var(--acc-lo)}
.px-search{height:calc(62*var(--u));flex-shrink:0;display:flex;gap:calc(10*var(--u));align-items:center}
.px-input{flex:1 1 auto;height:100%;display:flex;align-items:center;padding:0 calc(18*var(--u));background:#101113;border:calc(3*var(--u)) solid #3a3d44;box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 #000;font-size:calc(20*var(--u));color:#8f9299}
.px-list{flex:1 1 auto;min-height:0;overflow:hidden;border:calc(3*var(--u)) solid #24262b;background:rgba(12,13,16,var(--panel-a));padding:calc(16*var(--u)) calc(14*var(--u)) calc(16*var(--u)) calc(16*var(--u));display:flex;flex-direction:column;gap:calc(12*var(--u))}
.px-row{flex-shrink:0;min-height:calc(86*var(--u));display:flex;align-items:center;gap:calc(10*var(--u));padding:0 calc(20*var(--u)) 0 calc(22*var(--u));background:rgba(22,24,28,var(--row-a));border:calc(2*var(--u)) solid var(--row-line);box-shadow:inset calc(2*var(--u)) calc(2*var(--u)) 0 rgba(255,255,255,.07),inset calc(-2*var(--u)) calc(-3*var(--u)) 0 rgba(0,0,0,.5),calc(3*var(--u)) calc(3*var(--u)) 0 rgba(0,0,0,.55)}
.px-row:hover{filter:brightness(1.25)}
.px-t{flex:1 1 auto;min-width:0;font-size:calc(16*var(--u));font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.px-d{flex-shrink:0;font-family:var(--pixel);font-size:calc(11*var(--u));color:#9a9ca3}
.px-vip{flex-shrink:0;font-family:var(--pixel);font-weight:700;font-size:calc(11*var(--u));letter-spacing:calc(2*var(--u));padding:calc(3*var(--u)) calc(7*var(--u)) calc(3*var(--u)) calc(9*var(--u));background:var(--vip);color:#050507;box-shadow:inset calc(2*var(--u)) calc(2*var(--u)) 0 var(--vip-hi),inset calc(-2*var(--u)) calc(-3*var(--u)) 0 var(--vip-lo),calc(2*var(--u)) calc(2*var(--u)) 0 #000}
.px-now{flex-shrink:0;min-height:calc(100*var(--u));display:flex;align-items:center;gap:calc(14*var(--u));padding:0 calc(22*var(--u));background:#111214;border:calc(3*var(--u)) solid var(--now);box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 #000}
.px-now svg{width:calc(24*var(--u));height:calc(30*var(--u));color:var(--now);flex-shrink:0}
.px-now .px-t{font-weight:600}
.px-overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(5,5,9,.62)}
.px-modal{width:calc(460*var(--u));padding:calc(30*var(--u)) calc(30*var(--u)) calc(28*var(--u));background:rgba(24,25,29,var(--modal-a));border:calc(4*var(--u)) solid #b9bac0;box-shadow:calc(8*var(--u)) calc(8*var(--u)) 0 #000;text-align:center;color:#e6e6e8}
.px-modal h3{margin:0;text-align:left;font-size:calc(28*var(--u));line-height:1.3;color:#fff}
.px-modal p{margin:calc(22*var(--u)) 0;font-size:calc(18*var(--u));line-height:1.6}
.px-modal p b{color:var(--acc);font-weight:600}
.px-mbtn{min-height:calc(62*var(--u));display:flex;align-items:center;justify-content:center;gap:calc(12*var(--u));margin-top:calc(18*var(--u));font-family:var(--pixel);font-size:calc(15*var(--u));text-transform:uppercase;letter-spacing:1px;background:var(--acc);color:var(--acc-ink);border:calc(3*var(--u)) solid var(--btn-line);box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 #000,inset calc(3*var(--u)) calc(3*var(--u)) 0 var(--acc-hi),inset calc(-4*var(--u)) calc(-4*var(--u)) 0 var(--acc-lo)}
.px-mbtn.vip{min-height:calc(76*var(--u));background:var(--vip);border-color:var(--vip);color:#050507;box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 #000,inset calc(3*var(--u)) calc(3*var(--u)) 0 var(--vip-hi),inset calc(-4*var(--u)) calc(-6*var(--u)) 0 var(--vip-lo)}

/* ===== ORIGINAL glass design (scaled with --u) ===== */
.gl-ui{gap:calc(10*var(--u));padding:calc(8*var(--u)) calc(11*var(--u)) calc(6*var(--u));font-family:'JetBrains Mono',monospace;color:var(--txt)}
.gl-canvas{filter:blur(var(--blur));inset:calc(-20*var(--u)) !important;width:calc(100% + 40*var(--u)) !important;height:calc(100% + 40*var(--u)) !important}
.gl-glass{background:rgba(255,255,255,var(--glass-a));border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 1.5px 0 0 rgba(255,255,255,.3),0 2px 16px rgba(0,0,0,.12)}
.gl-balance{position:relative;height:calc(49*var(--u));flex-shrink:0;display:flex;justify-content:flex-end;align-items:center}
.gl-bal{position:absolute;left:50%;transform:translateX(-50%);min-width:40%;height:calc(49*var(--u));border-radius:999px;display:flex;align-items:center;justify-content:center;gap:calc(16*var(--u));padding:0 calc(11*var(--u));font-weight:800;font-size:calc(38*var(--u));color:rgba(255,255,255,.95)}
.gl-plus{width:calc(35*var(--u));height:calc(35*var(--u));border-radius:50%;display:grid;place-items:center;font-size:calc(22*var(--u));font-weight:400}
.gl-toggle{display:flex;gap:calc(11*var(--u));flex-shrink:0}
.gl-toggle div{flex:1 1 0;height:calc(59*var(--u));border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.12em;font-size:calc(27*var(--u));color:rgba(255,255,255,.75)}
.gl-toggle div.on{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45);color:var(--acc);text-shadow:0 0 8px var(--acc-glow),0 1px 2px rgba(0,0,0,.3)}
.gl-search{display:flex;gap:calc(11*var(--u));align-items:center;flex-shrink:0}
.gl-input{flex:1 1 auto;height:calc(46*var(--u));border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 calc(16*var(--u));font-size:calc(17*var(--u));color:rgba(255,255,255,.55)}
.gl-q{height:calc(43*var(--u));border-radius:999px;padding:0 calc(14*var(--u));display:flex;align-items:center;font-weight:700;letter-spacing:.08em;font-size:calc(17*var(--u));color:rgba(255,255,255,.88)}
.gl-main{flex:1 1 auto;min-height:0;display:flex;gap:calc(6*var(--u));overflow:hidden}
.gl-thumbs,.gl-songs{border-radius:calc(22*var(--u));padding:calc(16*var(--u));display:flex;flex-direction:column;gap:calc(13*var(--u));height:max-content}
.gl-songs{flex:1 1 auto;min-width:0}
.gl-thumb{width:calc(84*var(--u));height:calc(84*var(--u));flex-shrink:0;border-radius:calc(26*var(--u));display:grid;place-items:center;background:var(--base);border:1px solid rgba(255,255,255,.32);font-weight:800;font-size:calc(24*var(--u));color:rgba(255,255,255,.95);box-shadow:0 4px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.42)}
.gl-row{height:calc(84*var(--u));flex-shrink:0;border-radius:calc(26*var(--u));display:flex;align-items:center;gap:calc(8*var(--u));padding:0 calc(20*var(--u));background:rgba(255,255,255,var(--row-a));border:1px solid rgba(255,255,255,.28);box-shadow:0 2px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.38)}
.gl-row:hover{background:rgba(255,255,255,calc(var(--row-a) + .06))}
.gl-t{flex:1 1 auto;min-width:0;font-weight:600;font-size:calc(15*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}

.gl-vip{flex-shrink:0;padding:calc(3*var(--u)) calc(9*var(--u));border-radius:999px;font-weight:800;font-size:calc(11*var(--u));letter-spacing:.06em;color:var(--vip);background:var(--vip-tint);border:1px solid var(--vip-line)}
.gl-now{flex-shrink:0;min-height:calc(100*var(--u));border-radius:calc(26*var(--u));margin:0 calc(4*var(--u)) calc(4*var(--u));display:flex;align-items:center;gap:calc(12*var(--u));padding:calc(8*var(--u)) calc(16*var(--u));background:rgba(255,255,255,.14);border:1px solid var(--now);box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.45),0 0 0 1px var(--now-glow)}
.gl-now .gl-thumb{width:calc(76*var(--u));height:calc(76*var(--u))}

.gl-modal h3{margin:0;text-align:left;font-size:calc(26*var(--u));color:#fff}

.gl-mbtn.vip{background:var(--vip-tint);border-color:var(--vip-line);color:var(--vip);font-weight:800}

/* ---------- embedded in the Custom page: controls left/right, live screen on the model display ---------- */
.cfg{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,340px) minmax(var(--scr-w,300px),1fr) minmax(0,340px);gap:24px;padding:calc(var(--head-h,0px) + 16px) clamp(16px,3vw,48px) 20px;pointer-events:none}
.cfg > .controls{pointer-events:auto;max-height:100%;overflow-y:auto;align-self:start;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.cfg > .col-r{grid-column:3}
.opts{padding:14px 16px;border-top:3px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.top-sw{position:fixed;z-index:3;left:50%;top:40px;display:flex;gap:10px;transform:translate(-50%,-100%)}
.top-sw .seg-label{display:none}
.phones{position:fixed;left:calc(50% - 150px);top:60px;width:300px;height:520px;display:block}
.phone-card{position:absolute;inset:0}
.phone-card:not(.is-editing){display:none}
.phone-head{display:none}
.phone-frame{padding:0;border:0;box-shadow:none;background:none;height:100%;cursor:default}
.screen{aspect-ratio:auto;height:100%}
.sheet-head,.sheet-btn,html.disp .sheet-btn,html.disp .sheet-head{display:none!important}
@media (max-width:900px){html:not(.disp) .sheet-btn{display:flex!important}html:not(.disp) .sheet-head{display:flex!important}html.sheet-open .sheet-btn{display:none!important}}
@media (max-width:900px){
  html:not(.disp){zoom:1}
  .top-sw{left:50%!important;right:auto;top:14px!important;width:min(calc(100% - 24px),360px);transform:translateX(-50%);gap:8px}
  .top-sw .seg-wrap{flex:1 1 0;min-width:0}
  .top-sw .seg{display:flex;box-shadow:3px 3px 0 #000;border-width:2px}
  .top-sw .seg button{flex:1 1 0;min-width:0;padding:6px 4px;min-height:36px;font-size:10px;letter-spacing:1px}
  .sheet-btn{display:flex;align-items:center;justify-content:center;gap:10px;position:fixed;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);width:min(calc(100% - 24px),360px)}
  .cfg{inset:auto 0 0 0;max-height:58%;display:flex;flex-direction:column;gap:0;padding:0 0 12px;background:var(--panel);border-top:3px solid var(--line-2);box-shadow:0 -12px 40px rgba(0,0,0,.6);overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;z-index:5;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .sheet-open .cfg{transform:none}
  .sheet-open .sheet-btn{display:none}
  .cfg > .controls{border:0;box-shadow:none;max-height:none;overflow:visible}
  .cfg > .col-r{border-top:3px solid var(--line)}
  .sheet-head{display:flex;position:sticky;top:0;z-index:1;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;background:var(--panel);border-bottom:3px solid var(--line)}
  .sheet-head span{font-family:var(--pixel);font-size:12px;letter-spacing:2px;text-transform:uppercase}
  .sheet-head button{min-height:40px;min-width:44px;padding:0 12px}
  .range input{width:110px}
}
/* ---------- display mode: both designs on one screen, drag to compare ---------- */
html.disp{zoom:1}
.disp .cfg,.disp .top-sw{display:none}
.disp .phones{inset:0;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:ew-resize}
.disp .phone-card{display:block}
.disp #card-glass{clip-path:inset(0 0 0 var(--split,50%))}
.split{position:fixed;top:0;bottom:0;left:var(--split,50%);width:0;z-index:10;pointer-events:none;display:none}
.disp .split{display:block}
.split::before{content:"";position:absolute;top:0;bottom:0;left:-2px;width:4px;background:#fff;box-shadow:0 0 0 2px #050507}
.split i{position:absolute;top:50%;left:-26px;width:52px;height:52px;margin-top:-26px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #050507;box-shadow:4px 4px 0 #000;color:#050507}
.split i svg{width:30px;height:18px}
.split b{position:absolute;top:14px;font-family:var(--pixel);font-weight:400;font-size:16px;letter-spacing:3px;padding:6px 10px;background:#050507;color:#fff;white-space:nowrap}
.split b.l{right:12px}
.split b.r{left:12px}

@media (prefers-reduced-motion:reduce){.btn:active,.px-row:hover{transform:none}}

}
document.getElementById('btn-copy-css').addEventListener('click', function(){ copy(cssFor(ui.design), (LANG === 'en' ? 'CSS variables (' + (ui.design === 'pixel' ? 'Pixel' : 'Original') + ', both sections) copied.' : 'CSS proměnné (' + (ui.design === 'pixel' ? 'Pixel' : 'Původní') + ', obě sekce) zkopírovány.')); });
document.getElementById('btn-copy-json').addEventListener('click', function(){ copy(JSON.stringify(cfg, null, 2), T('Celé nastavení zkopírováno jako JSON.')); });
document.getElementById('btn-reset').addEventListener('click', function(){ cfg[ui.design][ui.mode] = clone(DEFAULTS[ui.design][ui.mode]); save(); syncChrome(); buildControls(); renderScreens(); sizeScreens(); toast(T('Obnoveny výchozí barvy pro ') + document.getElementById('edit-label').textContent + '.'); });
document.getElementById('btn-import-toggle').addEventListener('click', function(e){ var io = document.getElementById('io'); io.hidden = !io.hidden; e.currentTarget.setAttribute('aria-expanded', String(!io.hidden)); if (!io.hidden) document.getElementById('io-text').focus(); });
document.getElementById('btn-import').addEventListener('click', function(){
  try { var data = JSON.parse(document.getElementById('io-text').value); merge(cfg, data.cfg || data); save(); syncChrome(); buildControls(); renderScreens(); sizeScreens(); toast(T('Nastavení načteno.')); }
  catch (e) { toast(T('Tohle není platný JSON z tlačítka „Kopírovat JSON“.')); }
});

/* ---------------- sit on the model's display ---------------- */
var phonesEl = document.getElementById('phones'), topSw = document.querySelector('.top-sw'), lastRect = null;
function place(d){
  if (d) lastRect = d; d = lastRect; if (!d || !d.w) return;
  var fr = window.frameElement ? window.frameElement.getBoundingClientRect() : { left:0, top:0 };
  var Z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
  var x = (d.x - fr.left) / Z, y = (d.y - fr.top) / Z; d = { w: d.w / Z, h: d.h / Z };
  phonesEl.style.left = x + 'px'; phonesEl.style.top = y + 'px'; phonesEl.style.width = d.w + 'px'; phonesEl.style.height = d.h + 'px';
  topSw.style.left = (x + d.w / 2) + 'px'; topSw.style.top = Math.max(topSw.offsetHeight + 4, y - 14) + 'px';
  document.documentElement.style.setProperty('--scr-w', (d.w + 40) + 'px');
  try { var h2 = window.frameElement.parentNode.querySelector('h2'); if (h2) document.documentElement.style.setProperty('--head-h', (h2.getBoundingClientRect().bottom - fr.top) / Z + 'px'); } catch (e) {}
  sizeScreens();
}
try {
  var pw = window.parent;
  if (pw && pw !== window && !/[?&]display=/.test(location.search)) {
    pw.addEventListener('svanda', function(e){ if (e.detail && e.detail.type === 'screen') place(e.detail); });
    var st = pw.document.querySelector('svanda-stage'); if (st && st.screenRect) place(st.screenRect);
    window.addEventListener('resize', function(){ place(); });
    /* wheel over the page (not a scrollable column) still turns the parent's pages */
    document.addEventListener('wheel', function(e){
      var col = e.target.closest && e.target.closest('.controls');
      if (col) { var can = e.deltaY > 0 ? col.scrollTop + col.clientHeight < col.scrollHeight - 1 : col.scrollTop > 0; if (can) return; }
      e.preventDefault();
      pw.dispatchEvent(new WheelEvent('wheel', { deltaY:e.deltaY, deltaX:e.deltaX, deltaMode:e.deltaMode, cancelable:true }));
    }, { passive:false });
  }
} catch (e) {}

/* ---------------- display mode (Karaoke / Jukebox pages) ---------------- */
var DISP = (location.search.match(/[?&]display=(sing|listen)/) || [])[1];
if (DISP) {
  ui.mode = DISP; save = function(){};
  var root = document.documentElement, dragging = false;
  var setSplit = function(e){ var r = phonesEl.getBoundingClientRect(); root.style.setProperty('--split', Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100)) + '%'); };
  phonesEl.addEventListener('pointerdown', function(e){ dragging = true; phonesEl.setPointerCapture(e.pointerId); setSplit(e); e.preventDefault(); });
  phonesEl.addEventListener('pointermove', function(e){ if (dragging) setSplit(e); });
  phonesEl.addEventListener('pointerup', function(){ dragging = false; });
  phonesEl.addEventListener('pointercancel', function(){ dragging = false; });
  window.addEventListener('message', function(e){ var lg = e.data && e.data.svLang; if ((lg === 'cs' || lg === 'en') && lg !== LANG) { LANG = lg; applyLang(); buildControls(); syncChrome(); } });
  window.addEventListener('message', function(e){ var m = e.data && e.data.svMode; if ((m === 'sing' || m === 'listen') && m !== ui.mode) { ui.mode = m; renderScreens(); sizeScreens(); } });
  window.addEventListener('storage', function(e){ if (e.key === 'svanda-lang') { LANG = e.newValue === 'en' ? 'en' : 'cs'; applyLang(); buildControls(); syncChrome(); return; } if (e.key !== STORE_KEY) return; try { var sv = JSON.parse(e.newValue || 'null'); if (sv && sv.cfg) { merge(cfg, sv.cfg); applyVars('pixel'); applyVars('glass'); resetCanvas('pixel'); resetCanvas('glass'); } } catch (x) {} });
  document.addEventListener('wheel', function(e){ e.preventDefault(); try { window.parent.dispatchEvent(new WheelEvent('wheel', { deltaY:e.deltaY, deltaX:e.deltaX, deltaMode:e.deltaMode, cancelable:true })); } catch (x) {} }, { passive:false });
}

document.getElementById('sheet-open').addEventListener('click', function(){ document.documentElement.classList.add('sheet-open'); });
document.getElementById('sheet-close').addEventListener('click', function(){ document.documentElement.classList.remove('sheet-open'); });
/* attach the colour configuration to the contact request (read by the parent page at send time) */
var ATTACH_KEY = 'svanda-cfg-attach';
function attached(){ try { return localStorage.getItem(ATTACH_KEY) === '1'; } catch (e) { return false; } }
function syncAttach(){ var b = document.getElementById('btn-attach'), on = attached(); b.textContent = T(on ? 'Přidáno k mailu · odebrat' : 'Přidat konfiguraci k mailu'); b.classList.toggle('attached', on); b.setAttribute('aria-pressed', String(on)); }
document.getElementById('btn-attach').addEventListener('click', function(){
  var on = !attached(); save();
  try { if (on) localStorage.setItem(ATTACH_KEY, '1'); else localStorage.removeItem(ATTACH_KEY); } catch (e) {}
  try { window.parent.postMessage({ svAttach: on }, '*'); } catch (e) {}
  syncAttach(); if (on) toast(T('Konfigurace se pošle s žádostí.'));
});
window.addEventListener('storage', function(e){ if (e.key === ATTACH_KEY) syncAttach(); });
window.addEventListener('message', function(e){ if (e.data && 'svAttach' in e.data) syncAttach(); if (e.data && e.data.svLang) setTimeout(syncAttach, 0); });
/* ---------------- boot ---------------- */
applyLang(); syncAttach();
syncChrome(); buildControls(); renderScreens(); sizeScreens();
requestAnimationFrame(loop);
})();
</script>

</body>
